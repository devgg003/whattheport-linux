    <!-- Attention/Leaking Row -->
    <text x="4" y="94" fill="#FFB224" font-weight="700">  :5173  studio-vite          main  up 1h 10m                                   2.18 GB</text>

    <!-- Deleted Worktree Row -->
    <text x="4" y="118" fill="#EBEBF5">  :8000  billing-api          up 5h                                              268 MB</text>

    <!-- Footer -->
    <text x="0" y="198" fill="#EBEBF5" fill-opacity="0.35">────────────────────────────────────────────────────────────────────────────────────────</text>
    <text x="0" y="218" fill="#EBEBF5" fill-opacity="0.6"> [Enter] Details  [o] Open browser  [x] Stop  [c: Clean up (1)]  [q] Quit</text>
