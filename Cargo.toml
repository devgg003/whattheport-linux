[package]
name = "whattheport"
version = "0.2.0"
edition = "2024"
description = "Dev servers in your Linux top bar: ports, memory, git branches and cleanup"
license = "MIT"
repository = "https://github.com/devgg003/whattheport-linux"
publish = false

[lib]
name = "wtp_core"
path = "src/lib.rs"

[[bin]]
name = "wtp"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false }
ksni = "0.3.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
