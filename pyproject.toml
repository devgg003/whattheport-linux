[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whattheport-linux"
version = "0.1.0"
description = "Dev servers in your Linux top bar and terminal — native Linux port of WhatThePort"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "WhatThePort Contributors" }
]
keywords = ["linux", "gtk4", "libadwaita", "dev-servers", "ports", "monitor", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/devgg003/whattheport-linux"
Repository = "https://github.com/devgg003/whattheport-linux"
Issues = "https://github.com/devgg003/whattheport-linux/issues"

[project.scripts]
whattheport = "whattheport.gui.app:main"
whattheport-tray = "whattheport.gui.tray_status_notifier:run_tray"
wtp = "whattheport.tui.wtp:main"

[tool.setuptools.packages.find]
include = ["whattheport*"]

[tool.setuptools.package-data]
"whattheport.gui" = ["*.css"]
