<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%">
  <defs>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="16" y="12" width="788" height="292" rx="12" fill="#16171D" stroke="rgba(255,255,255,0.14)" filter="url(#termShadow)"/>
  <!-- Titlebar -->
  <rect x="16" y="12" width="788" height="32" rx="12" fill="#202129"/>
  <circle cx="36" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="56" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="76" cy="28" r="6" fill="#27C93F"/>
  <text x="410" y="32" fill="#EBEBF5" fill-opacity="0.6" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">wtp — Terminal UI</text>

  <!-- Terminal Body -->
  <g transform="translate(32, 66)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="0" y="0" fill="#F5F5F7" font-weight="700"> WhatThePort  |  Servers: 3.4 GB  CPU: 8.4%  Free: 5.50 GB</text>
    <text x="0" y="20" fill="#EBEBF5" fill-opacity="0.35">────────────────────────────────────────────────────────────────────────────────────────</text>

    <!-- Selected Row -->
    <rect x="0" y="30" width="756" height="22" rx="3" fill="#F5F5F7"/>
    <text x="4" y="46" fill="#16171D" font-weight="700">▶ :3000  web-dashboard        ✴ Fix OAuth callback  up 42m                       640 MB</text>

    <!-- Normal Row -->
